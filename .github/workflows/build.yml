name: Build

# Validates the code and both editions on every push and pull request.
#
# Lineage: the sibling books' build.yml -- the code first, parity as a hard
# gate, then a compile matrix, then a cross-reference comparison. This book
# adds one artefact they do not have: the plots, drawn by matplotlib from the
# same code the listings print, in each edition's own number format.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # The code comes first and gates everything. uv installs the pinned
  # interpreter from code/.python-version and the pinned packages from
  # code/uv.lock, and refuses to proceed if the lock is stale.
  # -------------------------------------------------------------------------
  code:
    name: Run every listing, lab and measurement
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.13"
          enable-cache: true
          cache-dependency-glob: "code/uv.lock"
      - name: Install the pinned interpreter and the locked environment
        run: uv sync --locked
      - name: Lint at 79 columns
        run: uv run ruff check .
      - name: Every listing runs, the library passes, every lab SOLUTION passes
        run: CHAOS_SOLUTIONS=1 uv run pytest
      - name: Every lab STARTER still fails
        # A lab whose starter already passes is not a lab. conftest.py marks
        # every lab test as a strict expected failure under this variable.
        run: CHAOS_STARTERS=fail uv run pytest labs
      - name: Regenerate every number and transcript the book prints
        run: |
          for f in measure/*.py; do
            case "$(basename "$f")" in _*) continue;; esac
            echo "== $f"; uv run python "$f"
          done
      - name: Fail if any committed value or transcript has drifted
        working-directory: .
        run: |
          # Two failures, and `git diff` alone sees only the first: drift in
          # a tracked file, and a file git has never seen.
          drift=$(git diff --name-only -- figures/values figures/transcripts)
          new=$(git ls-files --others --exclude-standard -- figures/values figures/transcripts)
          if [ -n "$drift" ] || [ -n "$new" ]; then
            echo "::error::A computed value or transcript differs from what code/measure now produces, or has never been committed."
            [ -n "$drift" ] && git diff -- figures/values figures/transcripts
            [ -n "$new" ] && { echo "Untracked:"; echo "$new"; }
            exit 1
          fi
          echo "Every computed value and transcript matches its script."
      - name: Draw every plot, in both editions
        run: |
          for f in plots/ch*.py; do echo "== $f"; uv run python "$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: values
          path: |
            figures/values
            figures/transcripts
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: plots
          path: figures/plots
          retention-days: 14
          if-no-files-found: ignore

  # -------------------------------------------------------------------------
  # Parity is a hard gate: a bilingual book fails by having a correction
  # applied to one edition and missed in the other. Every check here reads
  # the SOURCE and needs no PDF.
  # -------------------------------------------------------------------------
  parity:
    name: Polish and English in step
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: The manifest and the tree agree
        run: python3 tools/gen_stubs.py --check
      - name: Appendix B is generated from the chapters' traps
        run: python3 tools/gen_traps.py --check
      - name: Compare the two editions
        run: python3 tools/parity.py
      - name: Listings, labs, transcripts, plots, lines, pins, words, the method
        run: python3 tools/check_structure.py --all

  diagrams:
    name: Render diagrams
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Render every Mermaid source to PDF
        run: |
          shopt -s nullglob
          SRC=(figures/mermaid/*/*.mmd)
          if [ ${#SRC[@]} -eq 0 ]; then mkdir -p figures/diagrams; exit 0; fi
          printf '{"args":["--no-sandbox","--disable-dev-shm-usage"]}\n' > .puppeteer.json
          npm install -g @mermaid-js/mermaid-cli@11
          FAILED=0
          for f in "${SRC[@]}"; do
            lang=$(basename "$(dirname "$f")"); key=$(basename "$f" .mmd)
            mkdir -p "figures/diagrams/$lang"
            echo "::group::$lang/$key"
            # -w 1600: a render wider than the default 800-pixel viewport is
            # otherwise scaled down to fit it, and the book's width budget
            # for a diagram is measured on the NATURAL width.
            if ! timeout 180 mmdc -i "$f" -o "figures/diagrams/$lang/$key.pdf" \
                 -p .puppeteer.json -c figures/mermaid/config.json \
                 -b transparent --pdfFit -w 1600; then
              echo "::error file=$f::Mermaid failed to render $lang/$key"
              FAILED=1
            fi
            echo "::endgroup::"
          done
          exit $FAILED
      - uses: actions/upload-artifact@v4
        with:
          name: diagrams
          path: figures/diagrams
          retention-days: 14
          if-no-files-found: ignore

  build:
    name: Compile ${{ matrix.lang }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [code, parity, diagrams]
    strategy:
      fail-fast: false
      matrix:
        include:
          - lang: en
            pdf: Chaos-from-Zero
          - lang: pl
            pdf: Chaos-od-zera
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: values
          path: figures
      - uses: actions/download-artifact@v5
        with:
          name: plots
          path: figures/plots
      - uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: diagrams
          path: figures/diagrams
      - name: Index the value files
        run: |
          { echo '% Generated in CI --- do not edit.';
            for v in figures/values/*.tex; do
              case "$v" in */all.tex) continue;; esac
              [ -f "$v" ] && echo "\\input{${v%.tex}}"
            done; } > figures/values/all.tex
      - name: Compile with latexmk
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main-${{ matrix.lang }}.tex
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error
      # Not `grep '^!' main.log`: with -file-line-error an error line begins
      # with a path, and nonstopmode writes a PDF over the top of it.
      - name: Check the log properly
        run: python3 tools/checklog.py main-${{ matrix.lang }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-${{ matrix.lang }}
          path: main-${{ matrix.lang }}.log
          retention-days: 14
          if-no-files-found: warn
      - name: Rename artefact
        run: mv main-${{ matrix.lang }}.pdf "${{ matrix.pdf }}.pdf"
      - uses: actions/upload-artifact@v4
        with:
          name: book-${{ matrix.lang }}
          path: ${{ matrix.pdf }}.pdf
          retention-days: 14
      # The WHOLE aux tree: reflist.py follows \@input{} into the per-chapter
      # aux files, and given only the main one it would find no labels.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aux-${{ matrix.lang }}
          path: |
            main-${{ matrix.lang }}.aux
            chapters/${{ matrix.lang }}/*.aux
            appendices/${{ matrix.lang }}/*.aux
          retention-days: 3

  crossrefs:
    name: Cross-references resolve the same
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v5
        with:
          pattern: aux-*
          merge-multiple: true
      - run: python3 tools/reflist.py main-en.aux main-pl.aux
